<svg width="100%" viewBox="0 0 680 820" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AWS Image Processing Architecture — Design 2</title>
<desc>End-to-end AWS architecture for an image processing company, showing dual ingestion via API and Kafka, Lambda processing, S3 storage with 7-day lifecycle, DynamoDB metadata, and QuickSight BI layer.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 600; }
    .ts  { font-size: 12px; font-weight: 400; fill: #444; }
    .bg-blue   { fill: #dbeafe; stroke: #3b82f6; }
    .bg-teal   { fill: #d1fae5; stroke: #059669; }
    .bg-amber  { fill: #fef3c7; stroke: #d97706; }
    .bg-coral  { fill: #fee2e2; stroke: #ef4444; }
    .bg-green  { fill: #dcfce7; stroke: #16a34a; }
    .bg-pink   { fill: #fce7f3; stroke: #db2777; }
    .bg-purple { fill: #ede9fe; stroke: #7c3aed; }
    .bg-zone   { fill-opacity: 0.18; stroke-width: 0.5; rx: 10; }
    .node-box  { stroke-width: 0.5; rx: 8; }
    .arr       { stroke: #888; stroke-width: 1; fill: none; marker-end: url(#arrow); }
    .arr-dashed { stroke: #aaa; stroke-width: 0.8; fill: none; stroke-dasharray: 4 3; }
  </style>
</defs>

<!-- ── INGESTION SOURCES ── -->
<rect x="30" y="30" width="620" height="90" rx="10" class="bg-zone bg-blue" stroke="#3b82f6"/>
<text class="ts" x="44" y="50" style="font-weight:600">Ingestion sources</text>
<rect x="54" y="58" width="180" height="50" rx="8" class="bg-blue node-box"/>
<text class="th" x="144" y="80" text-anchor="middle" dominant-baseline="central">Web App Users</text>
<text class="ts" x="144" y="97" text-anchor="middle" dominant-baseline="central">HTTPS image upload</text>
<rect x="260" y="58" width="200" height="50" rx="8" class="bg-teal node-box"/>
<text class="th" x="360" y="80" text-anchor="middle" dominant-baseline="central">Kafka Stream Producers</text>
<text class="ts" x="360" y="97" text-anchor="middle" dominant-baseline="central">External — TLS encrypted</text>

<!-- ── EDGE & API LAYER ── -->
<rect x="30" y="150" width="295" height="130" rx="10" class="bg-zone bg-purple" stroke="#7c3aed"/>
<text class="ts" x="44" y="170" style="font-weight:600">Edge &amp; API layer</text>
<rect x="50" y="178" width="125" height="88" rx="8" class="bg-purple node-box"/>
<text class="th" x="112" y="207" text-anchor="middle" dominant-baseline="central">CloudFront</text>
<text class="ts" x="112" y="225" text-anchor="middle" dominant-baseline="central">+ AWS WAF</text>
<text class="ts" x="112" y="244" text-anchor="middle" dominant-baseline="central">DDoS · TLS 1.2+</text>
<rect x="192" y="178" width="118" height="88" rx="8" class="bg-purple node-box"/>
<text class="th" x="251" y="207" text-anchor="middle" dominant-baseline="central">API Gateway</text>
<text class="ts" x="251" y="225" text-anchor="middle" dominant-baseline="central">Auth · rate limit</text>
<text class="ts" x="251" y="244" text-anchor="middle" dominant-baseline="central">IAM PutObject only</text>

<!-- ── KAFKA LAYER ── -->
<rect x="345" y="150" width="305" height="130" rx="10" class="bg-zone bg-amber" stroke="#d97706"/>
<text class="ts" x="359" y="170" style="font-weight:600">Kafka layer — company managed (EKS)</text>
<rect x="362" y="178" width="118" height="88" rx="8" class="bg-amber node-box"/>
<text class="th" x="421" y="207" text-anchor="middle" dominant-baseline="central">NLB</text>
<text class="ts" x="421" y="225" text-anchor="middle" dominant-baseline="central">Network LB</text>
<text class="ts" x="421" y="244" text-anchor="middle" dominant-baseline="central">Private subnet</text>
<rect x="498" y="178" width="138" height="88" rx="8" class="bg-amber node-box"/>
<text class="th" x="567" y="207" text-anchor="middle" dominant-baseline="central">EKS + MSK</text>
<text class="ts" x="567" y="225" text-anchor="middle" dominant-baseline="central">Kafka brokers</text>
<text class="ts" x="567" y="244" text-anchor="middle" dominant-baseline="central">S3 Sink connector</text>

<!-- ── RAW STORAGE ── -->
<rect x="30" y="320" width="620" height="90" rx="10" class="bg-zone bg-coral" stroke="#ef4444"/>
<text class="ts" x="44" y="340" style="font-weight:600">Raw storage</text>
<rect x="150" y="350" width="380" height="50" rx="8" class="bg-coral node-box"/>
<text class="th" x="340" y="368" text-anchor="middle" dominant-baseline="central">S3 Raw Bucket</text>
<text class="ts" x="340" y="386" text-anchor="middle" dominant-baseline="central">SSE-KMS · Block public access · Lifecycle: DELETE after 7 days · S3 Event Trigger</text>

<!-- ── PROCESSING LAYER ── -->
<rect x="30" y="450" width="620" height="90" rx="10" class="bg-zone bg-green" stroke="#16a34a"/>
<text class="ts" x="44" y="470" style="font-weight:600">Processing layer</text>
<rect x="150" y="478" width="380" height="50" rx="8" class="bg-green node-box"/>
<text class="th" x="340" y="496" text-anchor="middle" dominant-baseline="central">AWS Lambda — Image Processor</text>
<text class="ts" x="340" y="514" text-anchor="middle" dominant-baseline="central">Company code hosted here · Auto-scaling · VPC private subnet · IAM least privilege</text>

<!-- ── PROCESSED STORAGE & METADATA ── -->
<rect x="30" y="580" width="620" height="90" rx="10" class="bg-zone bg-coral" stroke="#ef4444"/>
<text class="ts" x="44" y="600" style="font-weight:600">Processed storage &amp; metadata</text>
<rect x="54" y="608" width="268" height="50" rx="8" class="bg-coral node-box"/>
<text class="th" x="188" y="626" text-anchor="middle" dominant-baseline="central">S3 Processed Bucket</text>
<text class="ts" x="188" y="644" text-anchor="middle" dominant-baseline="central">SSE-AES256 · Lifecycle: DELETE after 7 days</text>
<rect x="342" y="608" width="268" height="50" rx="8" class="bg-pink node-box"/>
<text class="th" x="476" y="626" text-anchor="middle" dominant-baseline="central">DynamoDB — ImageMetadata</text>
<text class="ts" x="476" y="644" text-anchor="middle" dominant-baseline="central">TTL = 7 days · auto-expire · KMS encrypted</text>

<!-- ── ANALYTICS / BI ── -->
<rect x="30" y="710" width="620" height="90" rx="10" class="bg-zone bg-blue" stroke="#3b82f6"/>
<text class="ts" x="44" y="730" style="font-weight:600">Business intelligence (read-only analysts)</text>
<rect x="50" y="740" width="168" height="50" rx="8" class="bg-blue node-box"/>
<text class="th" x="134" y="758" text-anchor="middle" dominant-baseline="central">AWS Glue</text>
<text class="ts" x="134" y="776" text-anchor="middle" dominant-baseline="central">Data catalog · crawler</text>
<rect x="236" y="740" width="168" height="50" rx="8" class="bg-blue node-box"/>
<text class="th" x="320" y="758" text-anchor="middle" dominant-baseline="central">Amazon Athena</text>
<text class="ts" x="320" y="776" text-anchor="middle" dominant-baseline="central">SQL · pay-per-query</text>
<rect x="422" y="740" width="198" height="50" rx="8" class="bg-blue node-box"/>
<text class="th" x="521" y="758" text-anchor="middle" dominant-baseline="central">Amazon QuickSight</text>
<text class="ts" x="521" y="776" text-anchor="middle" dominant-baseline="central">BI dashboards · SSO via IAM</text>

<!-- ═══════════════ CONNECTORS ═══════════════ -->
<line x1="144" y1="108" x2="112" y2="178" class="arr"/>
<line x1="360" y1="108" x2="421" y2="178" class="arr"/>
<line x1="175" y1="222" x2="192" y2="222" class="arr"/>
<path d="M251 266 L251 295 L340 295 L340 350" class="arr"/>
<line x1="480" y1="222" x2="498" y2="222" class="arr"/>
<path d="M567 266 L567 295 L340 295 L340 350" stroke="#888" stroke-width="1" fill="none"/>
<line x1="340" y1="400" x2="340" y2="478" class="arr"/>
<path d="M290 528 L290 565 L188 565 L188 608" class="arr"/>
<path d="M390 528 L390 565 L476 565 L476 608" class="arr"/>
<path d="M188 658 L188 700 L134 700 L134 740" class="arr"/>
<path d="M476 658 L476 700 L134 700" class="arr-dashed"/>
<line x1="218" y1="765" x2="236" y2="765" class="arr"/>
<line x1="404" y1="765" x2="422" y2="765" class="arr"/>
</svg>
