<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Financial Report Analyzer — AWS architecture</title>
<desc>End-to-end pipeline from PDF upload through Textract parsing, OpenSearch indexing, two-stage NLP, to report.html output.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5C6478" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .th { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #1E2433; }
    .ts { font-family: -apple-system, sans-serif; font-size: 12px; fill: #5A6478; }
    .lbl { font-family: -apple-system, sans-serif; font-size: 11px; fill: #9CA3B0; }
    .gray   { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .amber  { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .blue   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
    .green  { fill: #ECFDF5; stroke: #059669; stroke-width: 0.5; }
    .conn   { stroke: #AAAAAA; stroke-width: 0.8; fill: none; }
    .arr    { stroke: #5C6478; stroke-width: 1.2; fill: none; }
    .dash   { stroke: #BBBBBB; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  </style>
</defs>

<!-- ── rail labels ── -->
<text class="lbl" x="32" y="94"  text-anchor="middle">Ingest</text>
<text class="lbl" x="32" y="214" text-anchor="middle">Parse</text>
<text class="lbl" x="32" y="344" text-anchor="middle">Index</text>
<text class="lbl" x="32" y="464" text-anchor="middle">Stage 1</text>
<text class="lbl" x="32" y="584" text-anchor="middle">Stage 2</text>
<text class="lbl" x="32" y="704" text-anchor="middle">Assemble</text>
<text class="lbl" x="32" y="804" text-anchor="middle">Output</text>

<!-- ══ 1. INGESTION ══ -->
<rect x="140" y="60" width="380" height="68" rx="8" class="gray"/>
<text class="th" x="330" y="88"  text-anchor="middle" dominant-baseline="central">PDF upload — API Gateway</text>
<text class="ts" x="330" y="108" text-anchor="middle" dominant-baseline="central">Ingestion Lambda · validates · stores to S3 raw bucket</text>

<!-- down arrow -->
<line x1="330" y1="128" x2="330" y2="158" class="arr" marker-end="url(#arrow)"/>

<!-- ══ 2. PARSING ══ -->
<rect x="100" y="158" width="460" height="68" rx="8" class="teal"/>
<text class="th" x="330" y="186" text-anchor="middle" dominant-baseline="central">Amazon Textract — parsing Lambda</text>
<text class="ts" x="330" y="206" text-anchor="middle" dominant-baseline="central">Reads PDF from S3 raw · extracts all text · up to ~3,000 sentences per document</text>

<!-- down arrow -->
<line x1="330" y1="226" x2="330" y2="296" class="arr" marker-end="url(#arrow)"/>

<!-- parsed text also stored to S3 processed (side arrow) -->
<line x1="560" y1="192" x2="600" y2="192" class="conn"/>
<line x1="600" y1="192" x2="600" y2="330" class="conn"/>
<line x1="600" y1="330" x2="576" y2="330" class="conn"/>
<text class="ts" x="626" y="268" text-anchor="middle" dominant-baseline="central">S3</text>
<text class="ts" x="626" y="284" text-anchor="middle" dominant-baseline="central">processed</text>

<!-- ══ 3. OPENSEARCH ══ -->
<rect x="160" y="296" width="340" height="68" rx="8" class="gray"/>
<text class="th" x="330" y="324" text-anchor="middle" dominant-baseline="central">OpenSearch</text>
<text class="ts" x="330" y="344" text-anchor="middle" dominant-baseline="central">Full-text index · all sentences instantly searchable</text>

<!-- Step Functions dashed rail -->
<text class="lbl" x="649" y="434" text-anchor="middle">Step</text>
<text class="lbl" x="649" y="448" text-anchor="middle">Functions</text>
<line x1="643" y1="364" x2="643" y2="664" class="dash"/>

<!-- down arrow + label -->
<line x1="330" y1="364" x2="330" y2="424" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="358" y="394" dominant-baseline="central">~3,000 sentences</text>

<!-- ══ 4. STAGE 1 ══ -->
<rect x="100" y="424" width="460" height="68" rx="8" class="purple"/>
<text class="th" x="330" y="452" text-anchor="middle" dominant-baseline="central">Stage 1 — keyword retrieval (Lambda)</text>
<text class="ts" x="330" y="472" text-anchor="middle" dominant-baseline="central">OpenSearch keyword search per financial metric · 3,000 → 100 candidates</text>

<!-- down arrow + label -->
<line x1="330" y1="492" x2="330" y2="544" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="358" y="518" dominant-baseline="central">100 candidates</text>

<!-- ══ 5. STAGE 2 ══ -->
<rect x="100" y="544" width="460" height="80" rx="8" class="amber"/>
<text class="th" x="330" y="572" text-anchor="middle" dominant-baseline="central">Stage 2 — text classification (Lambda + SageMaker)</text>
<text class="ts" x="330" y="592" text-anchor="middle" dominant-baseline="central">Keras endpoint · model loaded from S3 models bucket</text>
<text class="ts" x="330" y="610" text-anchor="middle" dominant-baseline="central">Accuracy 0.797 · Macro F1 0.737 · Top-3 + confidence scores</text>

<!-- S3 models → SageMaker dashed reference -->
<text class="ts" x="626" y="555" text-anchor="middle" dominant-baseline="central">S3</text>
<text class="ts" x="626" y="571" text-anchor="middle" dominant-baseline="central">models</text>
<line x1="614" y1="563" x2="562" y2="584" class="dash"/>

<!-- down arrow + label -->
<line x1="330" y1="624" x2="330" y2="664" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="358" y="644" dominant-baseline="central">Top-3 per metric</text>

<!-- ══ 6. ASSEMBLY ══ -->
<rect x="140" y="664" width="380" height="68" rx="8" class="teal"/>
<text class="th" x="330" y="692" text-anchor="middle" dominant-baseline="central">Assembly Lambda</text>
<text class="ts" x="330" y="712" text-anchor="middle" dominant-baseline="central">Merges Top-3 + financial field values · builds report</text>

<!-- down arrow -->
<line x1="330" y1="732" x2="330" y2="764" class="arr" marker-end="url(#arrow)"/>

<!-- ══ 7. OUTPUT ══ -->
<rect x="160" y="764" width="340" height="68" rx="8" class="green"/>
<text class="th" x="330" y="790" text-anchor="middle" dominant-baseline="central">result.json → report.html</text>
<text class="ts" x="330" y="810" text-anchor="middle" dominant-baseline="central">Written to S3 analytics bucket · accessed by analysts</text>
</svg>
