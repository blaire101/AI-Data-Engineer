<svg width="100%" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Financial Report Analyzer — AWS architecture</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5C6478" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .th { font-family:-apple-system,sans-serif; font-size:14px; font-weight:600; fill:#1E2433; }
    .ts { font-family:-apple-system,sans-serif; font-size:12px; fill:#5A6478; }
    .lbl{ font-family:-apple-system,sans-serif; font-size:11px; fill:#9CA3B0; }
    .gray   { fill:#F1EFE8; stroke:#888780; stroke-width:0.5; }
    .teal   { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.5; }
    .purple { fill:#EEEDFE; stroke:#534AB7; stroke-width:0.5; }
    .amber  { fill:#FAEEDA; stroke:#854F0B; stroke-width:0.5; }
    .blue   { fill:#E6F1FB; stroke:#185FA5; stroke-width:0.5; }
    .green  { fill:#ECFDF5; stroke:#059669; stroke-width:0.5; }
    .arr    { stroke:#5C6478; stroke-width:1.2; fill:none; }
    .conn   { stroke:#AAAAAA; stroke-width:0.8; fill:none; }
    .dash   { stroke:#BBBBBB; stroke-width:0.5; stroke-dasharray:4 3; fill:none; }
  </style>
</defs>

<!-- rail labels -->
<text class="lbl" x="30" y="88"  text-anchor="middle">Upload</text>
<text class="lbl" x="30" y="222" text-anchor="middle">Store</text>
<text class="lbl" x="30" y="332" text-anchor="middle">Parse</text>
<text class="lbl" x="30" y="462" text-anchor="middle">Index</text>
<text class="lbl" x="30" y="592" text-anchor="middle">Classify</text>
<text class="lbl" x="30" y="722" text-anchor="middle">Output</text>

<!-- dividers -->
<line x1="56" y1="148" x2="624" y2="148" stroke="#E3E6EE" stroke-width="0.5" fill="none"/>
<line x1="56" y1="278" x2="624" y2="278" stroke="#E3E6EE" stroke-width="0.5" fill="none"/>
<line x1="56" y1="408" x2="624" y2="408" stroke="#E3E6EE" stroke-width="0.5" fill="none"/>
<line x1="56" y1="528" x2="624" y2="528" stroke="#E3E6EE" stroke-width="0.5" fill="none"/>
<line x1="56" y1="658" x2="624" y2="658" stroke="#E3E6EE" stroke-width="0.5" fill="none"/>

<!-- ══ ROW 1: UPLOAD ══ -->
<rect x="64"  y="60" width="100" height="56" rx="8" class="gray"/>
<text class="th" x="114" y="83"  text-anchor="middle" dominant-baseline="central">Analyst</text>
<text class="ts" x="114" y="101" text-anchor="middle" dominant-baseline="central">uploads PDF</text>

<line x1="164" y1="88" x2="208" y2="88" class="arr" marker-end="url(#arrow)"/>

<rect x="208" y="60" width="148" height="56" rx="8" class="blue"/>
<text class="th" x="282" y="83"  text-anchor="middle" dominant-baseline="central">API Gateway</text>
<text class="ts" x="282" y="101" text-anchor="middle" dominant-baseline="central">HTTPS · auth · routing</text>

<line x1="356" y1="88" x2="400" y2="88" class="arr" marker-end="url(#arrow)"/>

<rect x="400" y="60" width="180" height="56" rx="8" class="amber"/>
<text class="th" x="490" y="83"  text-anchor="middle" dominant-baseline="central">Lambda — ingestion</text>
<text class="ts" x="490" y="101" text-anchor="middle" dominant-baseline="central">validates · stores PDF</text>

<line x1="490" y1="116" x2="490" y2="168" class="arr" marker-end="url(#arrow)"/>

<!-- ══ ROW 2: STORE ══ -->
<rect x="360" y="168" width="160" height="56" rx="8" class="blue"/>
<text class="th" x="440" y="191" text-anchor="middle" dominant-baseline="central">S3 raw bucket</text>
<text class="ts" x="440" y="209" text-anchor="middle" dominant-baseline="central">original PDFs</text>

<rect x="544" y="168" width="112" height="56" rx="8" class="blue"/>
<text class="th" x="600" y="191" text-anchor="middle" dominant-baseline="central">S3 models</text>
<text class="ts" x="600" y="209" text-anchor="middle" dominant-baseline="central">Keras tar.gz</text>

<!-- S3 raw triggers pipeline Lambda -->
<line x1="360" y1="196" x2="220" y2="196" class="conn"/>
<line x1="220" y1="196" x2="220" y2="298" class="conn"/>
<line x1="220" y1="298" x2="244" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="248" text-anchor="middle" dominant-baseline="central">S3</text>
<text class="ts" x="180" y="264" text-anchor="middle" dominant-baseline="central">trigger</text>

<!-- ══ ROW 3: PARSE ══ -->
<rect x="244" y="288" width="180" height="56" rx="8" class="amber"/>
<text class="th" x="334" y="311" text-anchor="middle" dominant-baseline="central">Lambda — pipeline</text>
<text class="ts" x="334" y="329" text-anchor="middle" dominant-baseline="central">main flow · orchestrates</text>

<line x1="424" y1="316" x2="468" y2="316" class="arr" marker-end="url(#arrow)"/>

<rect x="468" y="288" width="148" height="56" rx="8" class="teal"/>
<text class="th" x="542" y="311" text-anchor="middle" dominant-baseline="central">Amazon Textract</text>
<text class="ts" x="542" y="329" text-anchor="middle" dominant-baseline="central">OCR · ~3,000 sentences</text>

<!-- Textract returns to Lambda, Lambda → OpenSearch -->
<line x1="468" y1="344" x2="334" y2="344" class="conn"/>
<line x1="334" y1="344" x2="334" y2="418" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="388" dominant-baseline="central">all sentences</text>

<!-- ══ ROW 4: INDEX ══ -->
<rect x="244" y="418" width="356" height="56" rx="8" class="teal"/>
<text class="th" x="422" y="441" text-anchor="middle" dominant-baseline="central">OpenSearch</text>
<text class="ts" x="422" y="459" text-anchor="middle" dominant-baseline="central">bulk index · keyword search per metric · 3,000 → 100 candidates</text>

<line x1="422" y1="474" x2="422" y2="534" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="504" dominant-baseline="central">100 candidates</text>

<!-- ══ ROW 5: CLASSIFY ══ -->
<rect x="244" y="534" width="356" height="56" rx="8" class="purple"/>
<text class="th" x="422" y="557" text-anchor="middle" dominant-baseline="central">SageMaker endpoint — Keras classifier</text>
<text class="ts" x="422" y="575" text-anchor="middle" dominant-baseline="central">ml.m5.xlarge · Acc 0.797 · F1 0.737 · Top-3 + confidence scores</text>

<!-- S3 models → SageMaker dashed -->
<line x1="600" y1="224" x2="600" y2="562" class="dash"/>
<line x1="600" y1="562" x2="602" y2="562" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="622" y="394" text-anchor="middle" dominant-baseline="central">loads</text>
<text class="ts" x="622" y="410" text-anchor="middle" dominant-baseline="central">model</text>

<!-- SageMaker → Assembly Lambda -->
<line x1="422" y1="590" x2="422" y2="670" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="630" dominant-baseline="central">Top-3 per metric</text>

<!-- ══ ROW 6: OUTPUT ══ -->
<rect x="244" y="670" width="180" height="56" rx="8" class="amber"/>
<text class="th" x="334" y="693" text-anchor="middle" dominant-baseline="central">Lambda — assembly</text>
<text class="ts" x="334" y="711" text-anchor="middle" dominant-baseline="central">merges fields + Top-3</text>

<line x1="424" y1="698" x2="468" y2="698" class="arr" marker-end="url(#arrow)"/>

<rect x="468" y="670" width="148" height="56" rx="8" class="green"/>
<text class="th" x="542" y="693" text-anchor="middle" dominant-baseline="central">S3 analytics</text>
<text class="ts" x="542" y="711" text-anchor="middle" dominant-baseline="central">result.json · report.html</text>

<!-- return to analyst -->
<line x1="244" y1="698" x2="114" y2="698" class="conn"/>
<line x1="114" y1="698" x2="114" y2="116" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="80" y="758" text-anchor="middle" dominant-baseline="central">report</text>
<text class="ts" x="80" y="774" text-anchor="middle" dominant-baseline="central">returned</text>
</svg>
